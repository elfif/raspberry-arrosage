# Managed by deploy/install-services.sh — host-name for mDNS (arrosage.local).
# Other directives use the distribution defaults on first install; re-running
# the installer only ensures host-name=arrosage under [server].

[server]
host-name=arrosage
domain-name=local
use-ipv4=yes
use-ipv6=yes
allow-interfaces=wlan0,eth0
deny-interfaces=lo
browse-domains=
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
disable-publishing=no
disable-user-service-publishing=no
add-service-cookie=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-dns-servers=localhost
publish-resolv-conf-dns-servers=yes
publish-aaaa-on-ipv4=yes
publish-a-on-ipv6=no

[reflector]
enable-reflector=no
reflect-ipv=no
reflect-filters=_airplay._tcp.local,_raop._tcp.local

[rlimits]
