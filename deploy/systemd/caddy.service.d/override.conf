# Run Caddy as the project user so it can read the SPA build under ~/projects.
# Clear inherited ExecStart/ExecReload from the distro unit, then set explicit commands.
[Service]
EnvironmentFile=-/etc/arrosage/caddy-basic-auth.env
User=jnfrm
Group=jnfrm
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
